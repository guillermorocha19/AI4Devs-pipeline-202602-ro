# =============================================================================
# Backend CI/CD — LTI Talent Tracking System
# =============================================================================
# Flujo: Test → Build → Deploy a EC2 (secuencial con dependencias explícitas)
#
# Trigger: pull_request (opened, synchronize, reopened)
#   Se ejecuta cuando hay actividad en un PR abierto, en cualquier rama.
#
# SECRETS requeridos en GitHub (Settings → Secrets and variables → Actions):
#   EC2_SSH_PRIVATE_KEY  → Contenido completo de la clave privada (.pem)
#   EC2_INSTANCE             → IP pública o DNS de la instancia EC2
#   EC2_USER             → Usuario SSH (ej: ec2-user en Amazon Linux, ubuntu en Ubuntu)
#
# Prerrequisitos en EC2 (configuración manual, fuera del workflow):
#   - Node.js instalado (v18 o v20)
#   - PM2 instalado globalmente (npm install -g pm2)
#   - Directorio DEPLOY_DIR creado y con permisos de escritura
#   - Archivo .env con DATABASE_URL (la app lo necesita en runtime, no en CI)
#   - PostgreSQL accesible desde la instancia
# =============================================================================

name: Backend CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Variables no sensibles compartidas por todos los jobs
env:
  NODE_VERSION: "20"
  AWS_REGION: us-east-1
  APP_NAME: lti-backend
  BACKEND_DIR: backend
  # Ruta absoluta en EC2 donde se despliega el backend
  DEPLOY_DIR: /home/ec2-user/lti-backend
  ARTIFACT_NAME: backend-build
  # Puerto en el que escucha la aplicación (definido en src/index.ts)
  APP_PORT: "3010"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Test
  # Instala dependencias y ejecuta la suite de tests. El pipeline se detiene
  # aquí si algún test falla.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v6.0.3

      - name: Configurar Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run prisma:generate

      # tsc compila los *.test.ts a dist/ y Jest los re-ejecuta causando fallos.
      # Limpiamos dist/ antes de testear para ejecutar solo los tests de src/.
      - name: Limpiar dist/ previo (evita tests duplicados)
        run: rm -rf dist

      - name: Ejecutar tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 2 — Build
  # Solo se ejecuta si el Job 1 (test) termina con éxito.
  # Compila TypeScript y publica el artefacto para el despliegue.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v6.0.3

      - name: Configurar Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npm run prisma:generate

      - name: Compilar TypeScript
        run: npm run build

      - name: Verificar artefacto de build
        run: |
          test -f dist/index.js || (echo "Error: dist/index.js no encontrado" && exit 1)
          echo "Build generado correctamente:"
          ls -la dist/

      # Persiste el build y los archivos necesarios para ejecutar en EC2
      - name: Subir artefacto de build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.BACKEND_DIR }}/dist
            ${{ env.BACKEND_DIR }}/package.json
            ${{ env.BACKEND_DIR }}/package-lock.json
            ${{ env.BACKEND_DIR }}/prisma
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3 — Deploy a EC2
  # Solo se ejecuta si el Job 2 (build) termina con éxito.
  # Descarga el artefacto, lo transfiere por SSH/SCP y reinicia la aplicación.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Descargar artefacto de build
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: deploy-package

      - name: Verificar contenido del artefacto
        run: |
          echo "Contenido del paquete de despliegue:"
          ls -laR deploy-package/

      # Transfiere los archivos compilados y de configuración a EC2
      - name: Copiar artefacto a EC2 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: "deploy-package/*"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
          overwrite: true

      # Instala dependencias de producción, regenera Prisma y reinicia con PM2
      - name: Desplegar y reiniciar aplicación en EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_INSTANCE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            echo "==> Instalando dependencias de producción..."
            npm ci --omit=dev

            echo "==> Generando cliente Prisma..."
            npx prisma generate

            echo "==> Reiniciando aplicación con PM2..."
            if pm2 describe ${{ env.APP_NAME }} > /dev/null 2>&1; then
              pm2 restart ${{ env.APP_NAME }}
            else
              pm2 start dist/index.js --name ${{ env.APP_NAME }}
            fi

            pm2 save
            echo "==> Despliegue completado. Estado de la aplicación:"
            pm2 status ${{ env.APP_NAME }}

      # Resumen visible en la pestaña Summary de GitHub Actions
      - name: Resumen del despliegue
        if: success()
        run: |
          {
            echo "## Despliegue Backend — Exitoso"
            echo ""
            echo "| Parámetro | Valor |"
            echo "|-----------|-------|"
            echo "| Aplicación | \`${{ env.APP_NAME }}\` |"
            echo "| Host | \`${{ secrets.EC2_INSTANCE }}\` |"
            echo "| Directorio | \`${{ env.DEPLOY_DIR }}\` |"
            echo "| Puerto | \`${{ env.APP_PORT }}\` |"
            echo "| Región AWS | \`${{ env.AWS_REGION }}\` |"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| Rama | \`${{ github.head_ref }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "La aplicación fue desplegada y reiniciada correctamente en EC2."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notificar fallo de despliegue
        if: failure()
        run: |
          {
            echo "## Despliegue Backend — Fallido"
            echo ""
            echo "El despliegue a EC2 no se completó. Revisa los logs del job **Deploy to EC2**."
            echo ""
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Rama: \`${{ github.head_ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
